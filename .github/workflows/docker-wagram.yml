name: Build image Wagram

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/rdid-wfs/mini-qr-wagram:latest
          build-args: |
            VITE_HIDE_CREDITS=true
            VITE_DISABLE_LOCAL_STORAGE=true
           
